<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Sujal Giri — Building Intelligent Systems, Scalable Software &amp; Real-World AI Products</title>
  <desc id="bannerDesc">Original dark hero banner: midnight navy gradient, cyan and violet accents, no external assets.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1f"/>
      <stop offset="0.55" stop-color="#0b1530"/>
      <stop offset="1" stop-color="#171233"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="lineFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#38bdf8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- soft glows -->
  <circle cx="980" cy="70" r="130" fill="#8b5cf6" opacity="0.22" filter="url(#soft)"/>
  <circle cx="140" cy="300" r="110" fill="#22d3ee" opacity="0.16" filter="url(#soft)"/>
  <circle cx="880" cy="290" r="70" fill="#38bdf8" opacity="0.14" filter="url(#soft)"/>

  <!-- orbit / network motif, right side -->
  <g fill="none" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="1.2">
    <circle cx="980" cy="170" r="86"/>
    <circle cx="980" cy="170" r="52" stroke="#8b5cf6" stroke-opacity="0.55"/>
    <path d="M 894 170 L 1066 170" stroke-opacity="0.25"/>
    <path d="M 980 84 L 980 256" stroke-opacity="0.25"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="980" cy="170" r="7"/>
    <circle cx="1066" cy="170" r="4"/>
    <circle cx="980" cy="84" r="4"/>
    <circle cx="919" cy="109" r="3.5"/>
    <circle cx="1041" cy="231" r="3.5"/>
  </g>
  <g fill="#a78bfa">
    <circle cx="894" cy="170" r="4"/>
    <circle cx="980" cy="256" r="4"/>
    <circle cx="1041" cy="109" r="3.5"/>
  </g>
  <text x="980" y="174" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#e0f2fe">AI</text>

  <!-- left accent bar -->
  <rect x="72" y="72" width="6" height="150" rx="3" fill="url(#accent)"/>

  <!-- eyebrow -->
  <text x="100" y="92" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="4" fill="#67e8f9">AI / ML ENGINEER &#183; FULL-STACK DEVELOPER</text>

  <!-- name -->
  <text x="100" y="158" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="bold" letter-spacing="2" fill="#f8fafc">SUJAL GIRI</text>

  <!-- subtitle -->
  <text x="100" y="198" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#cbd5e1">Building Intelligent Systems, Scalable Software</text>
  <text x="100" y="228" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#cbd5e1">&amp; Real-World AI Products</text>

  <!-- gradient rule -->
  <rect x="100" y="252" width="420" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- focus areas -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#94a3b8">
    <text x="100" y="288">AI &amp; Machine Learning</text>
    <text x="290" y="288" fill="#334155">&#183;</text>
    <text x="308" y="288">Data Science</text>
    <text x="414" y="288" fill="#334155">&#183;</text>
    <text x="432" y="288">Full-Stack Development</text>
    <text x="612" y="288" fill="#334155">&#183;</text>
    <text x="630" y="288">Applied Research</text>
  </g>

  <!-- bottom strip -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#accent)"/>
</svg>
